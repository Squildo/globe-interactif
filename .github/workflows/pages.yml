name: Déployer TerraScope sur GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTEXTE.md
      - PROGRESSION.md
      - AGENTS.md
      - 'docs/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: terrascope-pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier et compiler
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Lire la configuration Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Installer et tester
        run: |
          npm ci
          npm test
      - name: Compiler l’édition web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PAGES_BASE_PATH" != /terrascope ]; then
            echo '::error::Le chemin GitHub Pages doit correspondre à la base Vite /terrascope/.'
            exit 1
          fi
          npm run build:pages
      - name: Vérifier l’artefact dans Chromium
        run: |
          npx --no-install playwright-core install --with-deps --no-shell chromium
          npm run test:pages
      - name: Transférer uniquement le site compilé
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages/

  deploy:
    name: Publier le site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer l’artefact validé
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
