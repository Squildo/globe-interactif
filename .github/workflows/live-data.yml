name: live-data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live planes (adsb.lol) and ships (openwaters) into live/
        run: python3 .github/scripts/fetch_live.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live/planes.json live/ships.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "live data refresh [skip ci]"
          git push
